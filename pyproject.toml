[project]
name = "dominoschizophrenia"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "ruff",
    "ty",
]

[tool.ruff]
target-version = "py314"
preview = true
unsafe-fixes = true
show-fixes = true
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
explicit-preview-rules = false
ignore = [
    "TD002",
    "TD003",
    "missing-todo-colon",
    "missing-todo-description",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # Allow assertions in tests.

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
respect-ignore-files = true

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
strict-literal-narrowing = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
